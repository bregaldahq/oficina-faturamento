# O role é criado pelo infra/ deste repo (irsa.tf). O deploy.yml troca o placeholder pelo ARN
# lido de /oficina/<env>/faturamento/irsa_role_arn. Não substitua por um valor fixo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-faturamento
  labels:
    app: oficina-faturamento
  annotations:
    eks.amazonaws.com/role-arn: IRSA_ROLE_ARN_PLACEHOLDER
