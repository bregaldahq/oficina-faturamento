apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-faturamento-nginx
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;
        access_log off;
        location /api/billing/docs {
            alias /var/www/html/docs;
            index index.html;
            try_files $uri $uri/ =404;
        }
        location = /api/billing/swagger.yaml {
            alias /var/www/html/swagger.yaml;
            add_header Content-Type "application/yaml";
        }
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }
