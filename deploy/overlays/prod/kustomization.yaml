apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-prod

resources:
  - ../../base
  - pdb.yaml

patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: external-secret-patch.yaml

configMapGenerator:
  - name: oficina-faturamento-config
    behavior: merge
    literals:
      - APP_ENV=production
      - APP_DEBUG=false
      - NEW_RELIC_APP_NAME=oficina-faturamento-prod

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: oficina-faturamento
    newName: oficina-faturamento
    newTag: prod
