apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oficina-faturamento-secret
spec:
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: oficina/hml/auth, property: JWT_SECRET }
    - secretKey: WEBHOOK_TOKEN
      remoteRef: { key: oficina/hml/auth, property: WEBHOOK_TOKEN }
    - secretKey: DB_HOST
      remoteRef: { key: oficina/hml/faturamento/db, property: host }
    - secretKey: DB_PORT
      remoteRef: { key: oficina/hml/faturamento/db, property: port }
    - secretKey: DB_DATABASE
      remoteRef: { key: oficina/hml/faturamento/db, property: dbname }
    - secretKey: DB_USERNAME
      remoteRef: { key: oficina/hml/faturamento/db, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: oficina/hml/faturamento/db, property: password }
    - secretKey: MP_ACCESS_TOKEN
      remoteRef: { key: oficina/hml/faturamento/mercadopago, property: MP_ACCESS_TOKEN }
    - secretKey: MP_WEBHOOK_SECRET
      remoteRef: { key: oficina/hml/faturamento/mercadopago, property: MP_WEBHOOK_SECRET }
